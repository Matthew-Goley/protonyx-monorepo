<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Link-preview copy. Keep all three descriptions identical, and keep every
      claim tied to real engine output (concentration, volatility, beta, caution
      score, no brokerage connection). See lens-ref-web/CLAUDE.md section 8.
    -->
    <meta
      name="description"
      content="Lens Arc reads your holdings and explains them in plain English: concentration, volatility, beta, and a single caution score. No brokerage login, just tickers and share counts."
    />
    <link rel="icon" type="image/png" href="/lens-arc-icon.png" />
    <title>lens arc</title>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lens-arc.com/" />
    <meta property="og:title" content="Know what your portfolio is actually doing." />
    <meta
      property="og:description"
      content="Lens Arc reads your holdings and explains them in plain English: concentration, volatility, beta, and a single caution score. No brokerage login, just tickers and share counts."
    />
    <!--
      og-image.png is an interim placeholder: a copy of the square brand mark
      (assets/lens-arc/icon-square.png). Because it is 1:1, twitter:card is
      "summary" (small square thumb) rather than "summary_large_image", which
      would letterbox or centre-crop a square. When a 1200x630 card is designed,
      swap the file, restore summary_large_image, and update width/height.
    -->
    <meta property="og:image" content="https://lens-arc.com/og-image.png" />
    <meta property="og:image:width" content="1025" />
    <meta property="og:image:height" content="1025" />
    <meta property="og:image:alt" content="Lens Arc" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Know what your portfolio is actually doing." />
    <meta
      name="twitter:description"
      content="Lens Arc reads your holdings and explains them in plain English: concentration, volatility, beta, and a single caution score. No brokerage login, just tickers and share counts."
    />
    <meta name="twitter:image" content="https://lens-arc.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
